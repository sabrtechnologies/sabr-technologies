<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Payment received — Sabr</title>
<style>
  /* A standalone page on purpose. The old delivery screen was an overlay
     injected on top of the marketing homepage, which meant it shared a DOM
     with a WebGL canvas, three IntersectionObservers and a scroll-reveal
     pass that toggle visibility on load — the panel appeared, got restyled,
     was re-appended by a 500ms self-healing timer, and a buyer watched their
     receipt blink in and out before it settled (Ethan's Windows machine,
     2026-07-29). Nothing on this page animates. There is nothing here to
     fight with. That is the fix. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#07070a;color:#f2f2f4}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       padding:6vh 5vw;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:32px;margin:0 0 6px;font-weight:700}
  h2{font-size:19px;margin:34px 0 8px;font-weight:600}
  p{margin:0 0 14px}
  .dim{opacity:.72}
  .small{font-size:14px}
  a{color:#9ecbff}
  .key{background:#111116;border:1px solid #2c2c36;border-radius:10px;padding:18px;
       font:600 20px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       letter-spacing:.06em;word-break:break-all;user-select:all}
  pre{background:#111116;border:1px solid #26262e;border-radius:8px;padding:16px;
      overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:13px;margin:0 0 12px}
  button{font:inherit;font-size:14px;background:none;border:1px solid #3a3a45;color:#f2f2f4;
         padding:10px 18px;border-radius:7px;cursor:pointer}
  button:hover{border-color:#5a5a68}
  .dl{display:inline-block;background:#f2f2f4;color:#07070a;padding:14px 22px;border-radius:8px;
      text-decoration:none;font-weight:700}
  .rule{height:1px;background:#1c1c24;margin:34px 0}
  .warn{border-left:3px solid #ff3b4e;padding-left:14px}
  /* Always all four, always real buttons — a wrong OS guess used to hide
     the other three behind a small text link, which is how a Windows
     buyer on Dean's Linux box only ever saw a terminal one-liner. Detected
     OS gets a lighter border + a small tag; nothing is ever hidden. */
  .dl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
  .dl-grid a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      background:#111116;border:1px solid #2c2c36;border-radius:8px;padding:16px 8px;
      text-decoration:none;color:#f2f2f4;text-align:center}
  .dl-grid a:hover{border-color:#5a5a68}
  .dl-grid a.rec{border-color:#5a5a68}
  .dl-grid a b{font-size:15px;font-weight:700}
  .dl-grid a span{font-size:12px;opacity:.6}
  .dl-grid a .tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.55}
  @media(max-width:520px){.dl-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Payment received.</h1>
  <p class="dim" id="sub">Provisioning your synthetic intelligence…</p>
  <div id="body"></div>
</div>
<script src="/js/site-network.js"></script>
<script>
(function () {
  var API = 'https://sabr-checkout-production.up.railway.app';
  var q = new URLSearchParams(window.location.search);
  var sid = q.get('session_id') || '';
  var sub = document.getElementById('sub');
  var body = document.getElementById('body');

  var win = /Win/i.test(navigator.platform) || /Windows/i.test(navigator.userAgent);
  var mac = !win && /Mac/i.test(navigator.platform);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  if (!sid) {
    sub.textContent = 'This page needs the link Stripe sent you back on.';
    body.innerHTML = '<p>Open the confirmation link from your receipt email, or write to ' +
      '<a href="mailto:deansabrwork@gmail.com">deansabrwork@gmail.com</a> and you will be set up by hand.</p>';
    return;
  }

  function render(d) {
    var i = d.installers || {};
    sub.textContent = 'Your SI is provisioned' + (d.email ? ' to ' + d.email : '') +
      '. Two steps and it is alive.';

    var h = '';

    /* The license key is the product. It leads on every OS, and it is the
       TOKEN — never the curl one-liner. The old page printed install_cmd
       under the words "your license key", so a Windows buyer pasted an
       entire `curl … | bash` string into the installer's key field and got
       "token wasn't recognized". Different artifacts, different jobs. */
    h += '<h2>1. Your license key</h2>' +
         '<p class="dim small">The installer asks for exactly this. Copy it now — ' +
         'this is the one thing worth keeping.</p>' +
         '<div class="key" id="key">' + esc(d.token) + '</div>' +
         '<p style="margin-top:12px"><button id="copyKey">Copy key</button></p>';

    h += '<div class="rule"></div><h2>2. Install</h2>' +
         '<p class="dim">Pick your platform. The key above works with any of them — ' +
         'a guessed OS used to hide the other three behind a small text link, which is ' +
         'exactly wrong the moment the guess is wrong.</p>';

    /* ALWAYS all four, ALWAYS real buttons, same order as the main site's
       download grid: Linux, Windows, Mac Apple Silicon, Mac Intel. The
       detected OS is marked recommended, never the only one offered —
       Apple Silicon is the assumed chip for a detected Mac (arch is not
       sniffable from the browser; M1–M4 is the common case, same
       assumption index.html's own OS-detect already makes), never Intel. */
    var GRID = [
      { key: 'linux',       label: 'Linux',  sub: '.deb — double-click installs', you: !win && !mac },
      { key: 'windows',     label: 'Windows', sub: '.exe',          you: win },
      { key: 'macos',       label: 'macOS',  sub: 'Apple Silicon', you: mac },
      { key: 'macos_intel', label: 'macOS',  sub: 'Intel',         you: false }
    ];
    h += '<div class="dl-grid">';
    GRID.forEach(function (g) {
      var href = i[g.key];
      if (!href) return;
      /* The checkout API still hands out the raw Linux ELF; the shipped
         package is the .deb (double-click installs, icon in the app menu).
         Swap it here so the buyer never meets a naked binary. */
      if (g.key === 'linux') href = href.replace(/\/sabr-installer$/, '/sabr-installer.deb');
      href = window.SabrUI.safeURL(href, ['github.com']);
      if (!href) return;
      h += '<a class="' + (g.you ? 'rec' : '') + '" href="' + esc(href) + '">' +
           '<b>' + g.label + '</b><span>' + g.sub + '</span>' +
           (g.you ? '<span class="tag">Recommended</span>' : '') + '</a>';
    });
    h += '</div>';

    /* Kept attached to their own platform, not merged into one blob — a
       Windows buyer should never have to read the Mac caveat to find
       theirs, and vice versa. */
    h += '<p class="dim small"><strong>Linux:</strong> double-click the package, hit ' +
         'Install, then open Sabr Installer from your applications menu.</p>' +
         '<p class="dim small"><strong>Windows:</strong> SmartScreen may warn about an ' +
         'unrecognised publisher — choose More info, then Run anyway. The build is not ' +
         'code-signed yet.</p>' +
         '<p class="dim small"><strong>Mac:</strong> unzip, then right-click the app and ' +
         'choose Open — not double-click. macOS will say the developer is unidentified; ' +
         'that is expected, the build is not notarised yet.</p>';

    if (d.install_cmd) {
      h += '<p class="dim small" style="margin-top:18px">Prefer the terminal? (macOS or ' +
           'Linux) This one line does the same thing, your key already in it.</p>' +
           '<pre id="cmd">' + esc(d.install_cmd) + '</pre>' +
           '<p><button id="copyCmd">Copy command</button></p>';
    }

    h += '<p class="dim small">Install takes roughly 5 to 10 minutes on a normal connection — ' +
         'most of it is downloading the brain. It is not frozen.</p>';

    h += '<div class="rule"></div>' +
         '<p class="dim small">A copy is on the way to your email. If it never lands, this page is ' +
         'the real thing — screenshot it. Anything at all goes sideways, reply to ' +
         '<a href="mailto:deansabrwork@gmail.com">deansabrwork@gmail.com</a> and the founder ' +
         'fixes it personally.</p>';

    body.innerHTML = h;

    function wire(btnId, srcId, label) {
      var b = document.getElementById(btnId), s = document.getElementById(srcId);
      if (!b || !s) return;
      b.addEventListener('click', function () {
        window.SabrUI.copy(s.textContent, b);
      });
    }
    wire('copyKey', 'key');
    wire('copyCmd', 'cmd');
  }

  /* Cache the delivered payload so a refresh or a back button shows it
     instantly. Written only after a successful render, never before. */
  var CACHE = 'sabr_install_' + sid;
  try {
    var saved = sessionStorage.getItem(CACHE);
    if (saved) { render(JSON.parse(saved)); return; }
  } catch (e) {}

  var tries = 0;
  (function poll() {
    tries++;
    window.SabrUI.json(API + '/install?session_id=' + encodeURIComponent(sid))
      .then(function (d) {
        if (d && d.ok && !d.pending && d.token) {
          try { sessionStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {}
          render(d);
          return;
        }
        if (tries < 40) return setTimeout(poll, 2000);
        throw new Error('still provisioning');
      })
      .catch(function () {
        if (tries < 40) return setTimeout(poll, 2000);
        sub.textContent = 'We could not confirm your installation status.';
        body.innerHTML = '<p class="warn">Check your receipt before trying another payment. ' +
          'Refresh this page to try again, or email <a href="mailto:deansabrwork@gmail.com">deansabrwork@gmail.com</a> ' +
          'with your receipt so we can check your order.</p>';
      });
  })();
})();
</script>
</body>
</html>
