sabrtechnologies.com, www.sabrtechnologies.com {
	bind 2.25.174.126 2a02:4780:75:e5c7::1
	encode gzip
	header X-Content-Type-Options nosniff
	header Referrer-Policy no-referrer
	header X-Frame-Options SAMEORIGIN

	@dotfiles path_regexp dotseg ^/(.*/)?\.[^/]*
	handle @dotfiles {
		respond 404
	}

	@backend path /ws/* /api/* /onboard /onboard/* /download /download/* /wintest /vendor/*
	handle @backend {
		reverse_proxy http://2.25.174.126:8000
	}

	# Publish customer pages and asset directories only. Repository source,
	# deployment configuration and build tools are not website assets.
	@public path / /index.html /privacy.html /quickstart.html /refunds.html /success.html /terms.html /troubleshooting.html /favicon.ico /robots.txt /sitemap.xml /landing-assets/* /js/* /shots/* /growth/*
	handle @public {
		root * /opt/leon-brain/workspaces/sabr-technologies
		file_server
	}
	handle {
		respond 404
	}

	@html path / /index.html *.html
	header @html Cache-Control "no-cache, no-store, must-revalidate"
	header @html Pragma no-cache
	@installer_metadata path *.sha256 *.sh *.ps1
	header @installer_metadata Cache-Control no-store
}
